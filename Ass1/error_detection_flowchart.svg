<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="auto" style="font-family: 'Times New Roman', Times, serif; background-color: #ffffff;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <!-- Filter for slight crisp card shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- SECTION LABELS / BACKGROUND LANES -->
  <rect x="15" y="15" width="1070" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="30" y="38" font-size="13" font-weight="bold" fill="#0369a1" letter-spacing="0.5">SENDER &amp; ERROR INJECTION PIPELINE</text>

  <rect x="15" y="270" width="1070" height="235" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="30" y="293" font-size="13" font-weight="bold" fill="#0369a1" letter-spacing="0.5">SOCKET CHANNEL &amp; RECEIVER VERIFICATION PIPELINE</text>

  <!-- ================= TIER 1: SENDER & ENCODING ================= -->

  <!-- 1. INPUT FILE -->
  <g transform="translate(35, 95)" filter="url(#shadow)">
    <rect width="90" height="42" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="45" y="26" font-size="11" font-weight="bold" text-anchor="middle" fill="#78350f">INPUT FILE</text>
  </g>

  <!-- Arrow to FileToBinary -->
  <line x1="125" y1="116" x2="150" y2="116" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. FileToBinary -->
  <g transform="translate(152, 95)" filter="url(#shadow)">
    <rect width="95" height="42" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="47.5" y="26" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">FileToBinary</text>
  </g>

  <!-- Arrow to BIT STREAM -->
  <line x1="247" y1="116" x2="272" y2="116" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. BIT STREAM -->
  <g transform="translate(274, 95)" filter="url(#shadow)">
    <rect width="95" height="42" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="47.5" y="26" font-size="11" font-weight="bold" text-anchor="middle" fill="#78350f">BIT STREAM</text>
  </g>

  <!-- Arrow to Break into packets -->
  <line x1="369" y1="116" x2="394" y2="116" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4. Break into packets -->
  <g transform="translate(396, 95)" filter="url(#shadow)">
    <rect width="115" height="42" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="57.5" y="21" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0369a1">Break into</text>
    <text x="57.5" y="34" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0369a1">Packets</text>
  </g>

  <!-- Arrow to SCHEMES -->
  <line x1="511" y1="116" x2="536" y2="116" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 5. SCHEMES -->
  <g transform="translate(538, 95)" filter="url(#shadow)">
    <rect width="80" height="42" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="40" y="26" font-size="11" font-weight="bold" text-anchor="middle" fill="#78350f">SCHEMES</text>
  </g>

  <!-- Branch from SCHEMES to Checksum (top) & CRC (bottom) -->
  <path d="M 618 106 L 642 75 L 655 75" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 618 126 L 642 155 L 655 155" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 6a. Generate Checksum -->
  <g transform="translate(658, 54)" filter="url(#shadow)">
    <rect width="125" height="42" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="62.5" y="21" font-size="10" font-weight="bold" text-anchor="middle" fill="#0369a1">Generate</text>
    <text x="62.5" y="34" font-size="10" font-weight="bold" text-anchor="middle" fill="#0369a1">Checksum</text>
  </g>

  <!-- Arrow to DATA + CHECKSUM -->
  <line x1="783" y1="75" x2="805" y2="75" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 7a. DATA + CHECKSUM -->
  <g transform="translate(807, 54)" filter="url(#shadow)">
    <rect width="125" height="42" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="62.5" y="21" font-size="10" font-weight="bold" text-anchor="middle" fill="#78350f">DATA +</text>
    <text x="62.5" y="34" font-size="10" font-weight="bold" text-anchor="middle" fill="#78350f">CHECKSUM</text>
  </g>

  <!-- 6b. Generate CRC -->
  <g transform="translate(658, 134)" filter="url(#shadow)">
    <rect width="125" height="42" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="62.5" y="21" font-size="10" font-weight="bold" text-anchor="middle" fill="#0369a1">Generate CRC</text>
    <text x="62.5" y="34" font-size="9" fill="#0369a1">(8/10/16/32)</text>
  </g>

  <!-- Arrow to DATA + CRC -->
  <line x1="783" y1="155" x2="805" y2="155" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 7b. DATA + CRC -->
  <g transform="translate(807, 134)" filter="url(#shadow)">
    <rect width="125" height="42" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="62.5" y="26" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#78350f">DATA + CRC</text>
  </g>

  <!-- Merge into DATAWORD -->
  <path d="M 932 75 L 952 105 L 965 105" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 932 155 L 952 125 L 965 125" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 8. DATAWORD -->
  <g transform="translate(968, 95)" filter="url(#shadow)">
    <rect width="95" height="42" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="47.5" y="26" font-size="11" font-weight="bold" text-anchor="middle" fill="#78350f">DATAWORD</text>
  </g>

  <!-- Transition Arrow downward from DATAWORD to ERROR INJECTION -->
  <path d="M 1015 137 L 1015 185 L 140 185 L 140 210" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ================= TIER 1B / 2: ERROR INJECTION & SOCKETS ================= -->

  <!-- ERROR INJECTION MODULE -->
  <g transform="translate(60, 208)" filter="url(#shadow)">
    <rect width="160" height="40" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="80" y="25" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">ERROR INJECTION</text>
  </g>

  <!-- Branches to 4 Error Types -->
  <path d="M 220 220 L 245 178 L 260 178" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 220 225 L 245 208 L 260 208" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 220 231 L 245 248 L 260 248" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 220 236 L 245 278 L 260 278" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- 4 Error Types Pills -->
  <g transform="translate(262, 163)">
    <rect width="70" height="28" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="35" y="18" font-size="10" font-weight="bold" text-anchor="middle" fill="#0369a1">SINGLE</text>
  </g>
  <g transform="translate(262, 194)">
    <rect width="70" height="28" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="35" y="18" font-size="10" font-weight="bold" text-anchor="middle" fill="#0369a1">DOUBLE</text>
  </g>
  <g transform="translate(262, 234)">
    <rect width="70" height="28" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="35" y="18" font-size="10" font-weight="bold" text-anchor="middle" fill="#0369a1">ODD</text>
  </g>
  <g transform="translate(262, 265)">
    <rect width="70" height="28" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="35" y="18" font-size="10" font-weight="bold" text-anchor="middle" fill="#0369a1">BURST</text>
  </g>

  <!-- Re-merge from 4 Error Types into CORRUPTED DATAWORD -->
  <path d="M 332 178 L 350 178 L 368 220" fill="none" stroke="#0284c7" stroke-width="1.8" />
  <path d="M 332 208 L 350 208 L 368 224" fill="none" stroke="#0284c7" stroke-width="1.8" />
  <path d="M 332 248 L 350 248 L 368 232" fill="none" stroke="#0284c7" stroke-width="1.8" />
  <path d="M 332 278 L 350 278 L 368 236" fill="none" stroke="#0284c7" stroke-width="1.8" />
  <line x1="368" y1="228" x2="385" y2="228" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- CORRUPTED DATAWORD -->
  <g transform="translate(388, 207)" filter="url(#shadow)">
    <rect width="115" height="42" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="57.5" y="19" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#78350f">CORRUPTED</text>
    <text x="57.5" y="33" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#78350f">DATAWORD</text>
  </g>

  <!-- Arrow to SEND VIA SOCKET -->
  <line x1="503" y1="228" x2="528" y2="228" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- SEND VIA SOCKET -->
  <g transform="translate(530, 207)" filter="url(#shadow)">
    <rect width="115" height="42" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="57.5" y="19" font-size="10" font-weight="bold" text-anchor="middle" fill="#0369a1">SEND VIA</text>
    <text x="57.5" y="33" font-size="10" font-weight="bold" text-anchor="middle" fill="#0369a1">SOCKET</text>
  </g>

  <!-- Arrow to SERVER -->
  <line x1="645" y1="228" x2="670" y2="228" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- SERVER -->
  <g transform="translate(672, 207)" filter="url(#shadow)">
    <rect width="80" height="42" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="40" y="26" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">SERVER</text>
  </g>

  <!-- Arrow to RECEIVE DATAWORD -->
  <line x1="752" y1="228" x2="777" y2="228" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- RECEIVE DATAWORD -->
  <g transform="translate(779, 207)" filter="url(#shadow)">
    <rect width="120" height="42" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="60" y="19" font-size="10" font-weight="bold" text-anchor="middle" fill="#78350f">RECEIVE</text>
    <text x="60" y="33" font-size="10" font-weight="bold" text-anchor="middle" fill="#78350f">DATAWORD</text>
  </g>

  <!-- Branch to CHECKSUM VALIDATION (down-left) and CRC VALIDATION (down-right) -->
  <path d="M 839 249 L 839 330 L 140 330 L 140 350" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 839 249 L 839 330 L 140 330 L 140 435" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ================= TIER 2: RECEIVER VALIDATION & DECISION ================= -->

  <!-- Branch 1: CHECKSUM VALIDATION -->
  <g transform="translate(85, 345)" filter="url(#shadow)">
    <rect width="150" height="42" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="75" y="19" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0369a1">CHECKSUM</text>
    <text x="75" y="33" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0369a1">VALIDATION</text>
  </g>

  <!-- Arrow to Decision 1 -->
  <line x1="235" y1="366" x2="275" y2="366" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision 1: Sum == All 1s? (Diamond) -->
  <g transform="translate(280, 366)" filter="url(#shadow)">
    <polygon points="0,-30 65,0 0,30 -65,0" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <text x="0" y="-4" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">Sum ==</text>
    <text x="0" y="10" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">All 1s?</text>
  </g>

  <!-- Decision 1 - Yes -> ACCEPT -->
  <path d="M 345 366 L 380 340 L 415 340" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="375" y="334" font-size="10" font-weight="bold" fill="#16a34a">Yes</text>
  <g transform="translate(420, 324)" filter="url(#shadow)">
    <rect width="80" height="32" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="40" y="21" font-size="11" font-weight="bold" text-anchor="middle" fill="#16a34a">ACCEPT</text>
  </g>

  <!-- Decision 1 - No -> REJECT -->
  <path d="M 345 366 L 380 392 L 415 392" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="375" y="405" font-size="10" font-weight="bold" fill="#dc2626">No</text>
  <g transform="translate(420, 376)" filter="url(#shadow)">
    <rect width="80" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <text x="40" y="21" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">REJECT</text>
  </g>


  <!-- Branch 2: CRC VALIDATION -->
  <g transform="translate(85, 430)" filter="url(#shadow)">
    <rect width="150" height="42" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="75" y="19" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0369a1">CRC</text>
    <text x="75" y="33" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0369a1">VALIDATION</text>
  </g>

  <!-- Arrow to Decision 2 -->
  <line x1="235" y1="451" x2="275" y2="451" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Decision 2: Remainder == 0? (Diamond) -->
  <g transform="translate(280, 451)" filter="url(#shadow)">
    <polygon points="0,-30 65,0 0,30 -65,0" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <text x="0" y="-4" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">Remainder</text>
    <text x="0" y="10" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">== 0?</text>
  </g>

  <!-- Decision 2 - Yes -> ACCEPT -->
  <path d="M 345 451 L 380 425 L 415 425" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="375" y="419" font-size="10" font-weight="bold" fill="#16a34a">Yes</text>
  <g transform="translate(420, 409)" filter="url(#shadow)">
    <rect width="80" height="32" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="40" y="21" font-size="11" font-weight="bold" text-anchor="middle" fill="#16a34a">ACCEPT</text>
  </g>

  <!-- Decision 2 - No -> REJECT -->
  <path d="M 345 451 L 380 477 L 415 477" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="375" y="490" font-size="10" font-weight="bold" fill="#dc2626">No</text>
  <g transform="translate(420, 461)" filter="url(#shadow)">
    <rect width="80" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <text x="40" y="21" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">REJECT</text>
  </g>

  <!-- SUMMARY NOTE / LEGEND ON RIGHT OF LOWER TIER -->
  <g transform="translate(550, 335)">
    <rect width="510" height="155" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
    <text x="18" y="26" font-size="11.5" font-weight="bold" fill="#0f172a">End-to-End Execution Protocol Summary:</text>
    <text x="18" y="50" font-size="10" fill="#334155">&#8226; <tspan font-weight="bold">Encoding:</tspan> File stream segmented into frames. 16-bit Checksum or CRC (8, 10, 16, 32) generated.</text>
    <text x="18" y="74" font-size="10" fill="#334155">&#8226; <tspan font-weight="bold">Frame Serialization:</tspan> Header (15B: MACs + Length + Seq) + Payload (45-1502B) + FCS (1-4B).</text>
    <text x="18" y="98" font-size="10" fill="#334155">&#8226; <tspan font-weight="bold">Channel Noise:</tspan> Configurable bit flipping (Single-bit, Double-bit, Odd 5-bit, Burst 8-bit).</text>
    <text x="18" y="122" font-size="10" fill="#334155">&#8226; <tspan font-weight="bold">Receiver Check:</tspan> Checksum tests if inverted sum is all 1s; CRC tests if mod-2 remainder is 0.</text>
    <text x="18" y="144" font-size="10" fill="#334155">&#8226; <tspan font-weight="bold">Action:</tspan> Intact frames decoded &amp; accepted; corrupted frames rejected &amp; logged.</text>
  </g>

</svg>
