<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter for Clean Modern Diagram Look -->
    <filter id="diagram-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <!-- Marker Arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b5cf6" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">CDMA System Architecture &amp; Concurrent Channel Model</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">Hadamard-Walsh Orthogonal Spread Spectrum with IEEE 802 Framing &amp; Full-Duplex Correlators</text>

  <!-- 1. Shared Physical Channel Medium Box (Top) -->
  <g filter="url(#diagram-shadow)">
    <rect x="120" y="75" width="760" height="155" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2.2" />
    <rect x="120" y="75" width="760" height="34" rx="10" fill="#2563eb" />
    <rect x="120" y="95" width="760" height="14" fill="#2563eb" />
    <text x="500" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">SHARED PHYSICAL MEDIUM (channel_server.exe : TCP 5050 / Simulation Thread)</text>

    <!-- Superposition Engine Block -->
    <rect x="150" y="125" width="310" height="85" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
    <text x="305" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">Linear Vector Superposition</text>
    <text x="305" y="168" text-anchor="middle" font-size="11" fill="#1d4ed8">C_composite[t] = &#x2211; S_i[t]  (i = 0 to n-1)</text>
    <text x="305" y="188" text-anchor="middle" font-size="10.5" fill="#475569">Synchronous Chip-Level Summation</text>

    <!-- AWGN Noise Block -->
    <rect x="490" y="125" width="360" height="85" rx="8" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5" />
    <text x="670" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7e22ce">Additive Noise Module (AWGN)</text>
    <text x="670" y="168" text-anchor="middle" font-size="11" fill="#6b21a8">C_noisy[t] = C_composite[t] + N(0, &#x3C3;&#xB2;)</text>
    <text x="670" y="188" text-anchor="middle" font-size="10.5" fill="#475569">Configurable Target SNR (dB) &amp; Processing Gain</text>
  </g>

  <!-- Physical Medium Bus Line -->
  <line x1="120" y1="260" x2="880" y2="260" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
  <rect x="390" y="248" width="220" height="24" rx="4" fill="#0284c7" />
  <text x="500" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">SHARED MEDIUM BROADCAST BUS</text>

  <!-- Medium Interconnect Arrows -->
  <line x1="305" y1="230" x2="305" y2="258" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <line x1="670" y1="230" x2="670" y2="258" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- 2. Station 0 Box (Bottom Left) -->
  <g filter="url(#diagram-shadow)">
    <rect x="50" y="300" width="420" height="375" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <rect x="50" y="300" width="420" height="32" rx="12" fill="#475569" />
    <rect x="50" y="320" width="420" height="12" fill="#475569" />
    <text x="260" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">STATION 0 (Walsh Code: C_0 = [+1, +1, +1, +1])</text>

    <!-- TX Thread Section -->
    <rect x="70" y="345" width="380" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="70" y="345" width="380" height="24" rx="8" fill="#e2e8f0" />
    <text x="260" y="361" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">TRANSMIT THREAD (Main / Station TX)</text>
    
    <text x="85" y="388" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Payload:</tspan> "Station 0 Data Message"</text>
    <text x="85" y="408" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Frame Builder:</tspan> IEEE 802 MAC + Len + CRC-32</text>
    <text x="85" y="428" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Bipolar Modulation:</tspan> '1' &#x2192; +1, '0' &#x2192; -1</text>
    <text x="85" y="448" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Chip Spreading:</tspan> S_0[t] = d_0 &#xD7; C_0  (Length = Bits &#xD7; N)</text>
    <text x="85" y="468" font-size="10.5" font-weight="600" fill="#2563eb">&#x2192; Emits Chipping Vector to Shared Medium Socket</text>

    <!-- RX Listener Thread Section -->
    <rect x="70" y="505" width="380" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="70" y="505" width="380" height="24" rx="8" fill="#ecfdf5" />
    <text x="260" y="521" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">BACKGROUND RECEIVER THREAD (Full-Duplex Correlator)</text>

    <text x="85" y="548" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Receives:</tspan> Broadcast Composite Vector C_comp</text>
    <text x="85" y="568" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Inner Product Despreader:</tspan> &#x2211; C_comp[k] &#xD7; C_0[k]</text>
    <text x="85" y="588" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Decision Threshold:</tspan> Dot &gt; 0 &#x2192; '1', Dot &lt; 0 &#x2192; '0'</text>
    <text x="85" y="608" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Frame Extraction:</tspan> IEEE 802 CRC-32 FCS Check</text>
    <text x="85" y="628" font-size="11" font-weight="700" fill="#059669">&#x2192; CRC-32 Validation: PASS [OK] (Zero Cross-Talk)</text>
    <text x="85" y="646" font-size="10.5" fill="#475569">&#x2192; Signals TX Thread via hRxDoneEvent</text>
  </g>

  <!-- Connectors: Station 0 to Bus -->
  <line x1="200" y1="345" x2="200" y2="265" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="140" y="275" width="120" height="18" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="200" y="288" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">Send Chipping Vector S_0</text>

  <line x1="330" y1="265" x2="330" y2="505" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-green)" />
  <rect x="270" y="275" width="130" height="18" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="335" y="288" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065f46">Recv Broadcast C_comp</text>

  <!-- 3. Station (n-1) Box (Bottom Right) -->
  <g filter="url(#diagram-shadow)">
    <rect x="530" y="300" width="420" height="375" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <rect x="530" y="300" width="420" height="32" rx="12" fill="#475569" />
    <rect x="530" y="320" width="420" height="12" fill="#475569" />
    <text x="740" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">STATION (n-1) (Walsh Code: C_n-1 = [+1, -1, -1, +1])</text>

    <!-- TX Thread Section -->
    <rect x="550" y="345" width="380" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="550" y="345" width="380" height="24" rx="8" fill="#e2e8f0" />
    <text x="740" y="361" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">TRANSMIT THREAD (Main / Station TX)</text>
    
    <text x="565" y="388" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Payload:</tspan> "Station n-1 Network Frame"</text>
    <text x="565" y="408" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Frame Builder:</tspan> IEEE 802 MAC + Len + CRC-32</text>
    <text x="565" y="428" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Bipolar Modulation:</tspan> '1' &#x2192; +1, '0' &#x2192; -1</text>
    <text x="565" y="448" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Chip Spreading:</tspan> S_n-1[t] = d_n-1 &#xD7; C_n-1</text>
    <text x="565" y="468" font-size="10.5" font-weight="600" fill="#2563eb">&#x2192; Concurrent Transmission (No Carrier Sensing Delay)</text>

    <!-- RX Listener Thread Section -->
    <rect x="550" y="505" width="380" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="550" y="505" width="380" height="24" rx="8" fill="#ecfdf5" />
    <text x="740" y="521" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">BACKGROUND RECEIVER THREAD (Full-Duplex Correlator)</text>

    <text x="565" y="548" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Receives:</tspan> Broadcast Composite Vector C_comp</text>
    <text x="565" y="568" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Inner Product Despreader:</tspan> &#x2211; C_comp[k] &#xD7; C_n-1[k]</text>
    <text x="565" y="588" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Decision Threshold:</tspan> Dot &gt; 0 &#x2192; '1', Dot &lt; 0 &#x2192; '0'</text>
    <text x="565" y="608" font-size="11" fill="#0f172a">&#x2022; <tspan font-weight="600">Frame Extraction:</tspan> IEEE 802 CRC-32 FCS Check</text>
    <text x="565" y="628" font-size="11" font-weight="700" fill="#059669">&#x2192; CRC-32 Validation: PASS [OK] (Zero Cross-Talk)</text>
    <text x="565" y="646" font-size="10.5" fill="#475569">&#x2192; Signals TX Thread via hRxDoneEvent</text>
  </g>

  <!-- Connectors: Station (n-1) to Bus -->
  <line x1="680" y1="345" x2="680" y2="265" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="615" y="275" width="130" height="18" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="680" y="288" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e40af">Send Chipping Vector S_n-1</text>

  <line x1="810" y1="265" x2="810" y2="505" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-green)" />
  <rect x="745" y="275" width="130" height="18" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="810" y="288" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065f46">Recv Broadcast C_comp</text>

  <!-- Mid text between stations -->
  <text x="500" y="475" text-anchor="middle" font-size="18" font-weight="700" fill="#94a3b8">&#x2022; &#x2022; &#x2022;</text>
  <text x="500" y="495" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Stations 1 to n-2</text>
</svg>
